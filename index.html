<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Customer Registration</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #eef2f3; 
            padding: 40px 20px; 
            margin: 0;
        }
        .form-container { 
            max-width: 450px; 
            background: white; 
            padding: 30px; 
            margin: 0 auto; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.05); 
        }
        h2 { 
            text-align: center; 
            color: #2c3e50; 
            margin-top: 0;
            margin-bottom: 25px; 
            font-size: 24px;
        }
        label { 
            font-weight: 600; 
            display: block; 
            margin: 16px 0 6px; 
            color: #34495e; 
            font-size: 14px;
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #0088cc;
            outline: none;
        }
        button { 
            width: 100%; 
            background: #0088cc; 
            color: white; 
            border: none; 
            padding: 14px; 
            margin-top: 25px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: background 0.2s;
        }
        button:hover { 
            background: #0077b5; 
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>New Customer Registration</h2>
    
    <!-- 🟢 Standard form routing that bypasses browser-level blockades -->
    <form action="https://formsubmit.co" method="POST">
        
        <!-- Redirects the user right back to your site after they click submit -->
        <input type="hidden" name="_next" value="https://github.io">
        <!-- Disables the annoying captcha confirmation page -->
        <input type="hidden" name="_captcha" value="false">

        <label for="name">Full Name *</label>
        <input type="text" name="Full Name" id="name" required placeholder="John Doe">

        <label for="phone">Telephone Number *</label>
        <input type="tel" name="Phone Number" id="phone" required placeholder="e.g. +44 7123 456789">

        <label for="package">Package Interested In *</label>
        <select name="Selected Package" id="package" required>
            <option value="" disabled selected>-- Choose a package --</option>
            <option value="1 Connection">1 Connection</option>
            <option value="2 Connections">2 Connections</option>
            <option value="3 Connections">3 Connections</option>
            <option value="4 Connections">4 Connections</option>
            <option value="Spotify Premium">Spotify Premium</option>
        </select>

        <label for="referral">Referral Code (Optional)</label>
        <input type="text" name="Referral Code" id="referral" placeholder="e.g. REF123">

        <button type="submit">Submit Details</button>
    </form>
</div>

</body>
</html>
